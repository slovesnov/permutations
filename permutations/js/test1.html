<html>
<head>
<meta http-equiv="content-type" content="text/html; charset=ISO-8859-1">
<script src="permutations.js"></script>
<script>
function load() {
	let i, t, s = '';
	let p = new Permutations();
	for (t of Permutations.Types) {
		p.init(2, 4, t);
		s += "combinations=" + String(p.number()).padStart(2) + " ";
		do {
			s += "{";
			for (i = 0; i < p.getK(); i++) {
				if (i != 0) {
					s += " ";
				}
				s += p.getIndex(i);
			}
			s += "}";
		} while (p.next());
		s += '<br>'
	}
	document.getElementById('p').innerHTML = s
}
</script>
</head>
<body onload="load()">
<pre id="p"></pre>
</body>
</html>
